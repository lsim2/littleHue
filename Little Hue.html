<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Little Hue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --page:#FBF1EE; --ink:#6B3F55; --chip:rgba(255,255,255,.82); --chip-ink:#6B3F55; --shadow:rgba(107,63,85,.18);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --page:#1D1A33; --ink:#E9E4FF; --chip:rgba(60,56,110,.85); --chip-ink:#F3EEFF; --shadow:rgba(0,0,0,.4); color-scheme:dark; }
}
:root[data-theme="dark"]{ --page:#1D1A33; --ink:#E9E4FF; --chip:rgba(60,56,110,.85); --chip-ink:#F3EEFF; --shadow:rgba(0,0,0,.4); color-scheme:dark; }
html,body{height:100%;margin:0}
body{
  background:var(--page); color:var(--ink); overflow:hidden;
  font-family:'Fredoka','Trebuchet MS','Segoe UI',sans-serif;
  -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent;
  touch-action:none; overscroll-behavior:none;
}
#stage{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
canvas{display:block;border-radius:20px;box-shadow:0 10px 40px var(--shadow);touch-action:none;outline:none}
#chips{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:12px;display:flex;gap:8px;z-index:5}
#chips button{
  font:600 14px 'Fredoka','Trebuchet MS',sans-serif; color:var(--chip-ink); background:var(--chip);
  border:0; border-radius:999px; padding:8px 14px; cursor:pointer; box-shadow:0 2px 10px var(--shadow);
}
#chips button:focus-visible,#touch button:focus-visible{outline:3px solid #A5A5E8;outline-offset:2px}
body:not(.playing) #btnMap,body:not(.playing) #btnTips{display:none}
#touch{display:none;position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));padding:0 16px;justify-content:space-between;align-items:flex-end;pointer-events:none;z-index:4}
body.touch.playing #touch{display:flex}
#touch .cluster{display:flex;gap:14px}
#touch button{
  pointer-events:auto; width:74px;height:74px;border-radius:50%;border:0;
  background:var(--chip); color:var(--chip-ink); font-size:28px; box-shadow:0 3px 14px var(--shadow);
  opacity:.82; touch-action:none; font-family:inherit;
}
#touch button.down{opacity:1;transform:scale(.94)}
#touch #bJ{width:88px;height:88px}
#touch #bP{display:none;width:74px;height:74px;font-size:15px;font-weight:600}
body.pourlevel #touch #bP{display:inline-block}
@media (prefers-reduced-motion: reduce){ #touch button.down{transform:none} }
</style>
</head>
<body>
<div id="stage"><canvas id="game" width="960" height="544" tabindex="0" aria-label="Little Hue, a cozy color platformer"></canvas></div>
<div id="chips">
  <button id="btnTips" type="button" aria-pressed="false">Tips off</button>
  <button id="btnSound" type="button" aria-pressed="false">Sound on</button>
  <button id="btnMap" type="button">Map</button>
</div>
<div id="touch">
  <div class="cluster"><button id="bL" type="button" aria-label="Move left">◀</button><button id="bR" type="button" aria-label="Move right">▶</button></div>
  <div class="cluster"><button id="bP" type="button" aria-label="Pour">Pour</button><button id="bJ" type="button" aria-label="Jump">▲</button></div>
</div>

<script>
(()=>{
'use strict';

/* ================================================================
   Little Hue — a cozy color platformer
   ================================================================ */
const W=960, H=544, T=32, ROWS=17;
const REDUCE=!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);
const $=id=>document.getElementById(id);
const cv=$('game'), ctx=cv.getContext('2d');
let sc=1;

function resize(){
  const wrap=$('stage');
  const aw=wrap.clientWidth||W, ah=wrap.clientHeight||H;
  const s=Math.min(aw/W, ah/H);
  const cssW=Math.max(1,Math.floor(W*s)), cssH=Math.max(1,Math.floor(H*s));
  cv.style.width=cssW+'px'; cv.style.height=cssH+'px';
  const dpr=Math.min(window.devicePixelRatio||1,2);
  cv.width=Math.round(cssW*dpr); cv.height=Math.round(cssH*dpr);
  sc=cv.width/W;
}
window.addEventListener('resize',resize);

/* ---------- utils ---------- */
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const approach=(v,t,d)=>v<t?Math.min(v+d,t):Math.max(v-d,t);
function hash(a,b){ let h=(a*374761393+b*668265263)|0; h=(h^(h>>>13))*1274126177|0; return ((h^(h>>>16))>>>0)/4294967295; }
function hex2rgb(h){ h=h.replace('#',''); return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]; }
function rr(x,y,w,h,r){ r=Math.min(r,w/2,h/2); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function rrc(x,y,w,h,tl,tr,br,bl){
  ctx.beginPath(); ctx.moveTo(x+tl,y); ctx.lineTo(x+w-tr,y);
  if(tr) ctx.arcTo(x+w,y,x+w,y+tr,tr); else ctx.lineTo(x+w,y);
  ctx.lineTo(x+w,y+h-br);
  if(br) ctx.arcTo(x+w,y+h,x+w-br,y+h,br); else ctx.lineTo(x+w,y+h);
  ctx.lineTo(x+bl,y+h);
  if(bl) ctx.arcTo(x,y+h,x,y+h-bl,bl); else ctx.lineTo(x,y+h);
  ctx.lineTo(x,y+tl);
  if(tl) ctx.arcTo(x,y,x+tl,y,tl); else ctx.lineTo(x,y);
  ctx.closePath();
}
function circle(x,y,r){ ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill(); }
const FONT='Fredoka,"Trebuchet MS","Segoe UI",sans-serif';
function txt(s,x,y,size,color,opt={}){
  ctx.font=(opt.weight||600)+' '+size+'px '+FONT;
  ctx.textAlign=opt.align||'center'; ctx.textBaseline=opt.base||'middle';
  if(opt.alpha!==undefined) ctx.globalAlpha=opt.alpha;
  ctx.fillStyle=color; ctx.fillText(s,x,y);
  if(opt.alpha!==undefined) ctx.globalAlpha=1;
}

/* ---------- save ---------- */
let save={done:[false,false,false,false,false],best:[0,0,0,0,0],v:4};
let muted=false, allUnlocked=false, tipsOn=false;
try{ const s=JSON.parse(localStorage.getItem('lh_save')||'null'); if(s&&Array.isArray(s.done)&&Array.isArray(s.best)){ save=s; if(save.v!==3){
      if(save.v!==2){ [save.done[2],save.done[3]]=[save.done[3],save.done[2]]; [save.best[2],save.best[3]]=[save.best[3],save.best[2]]; }
      const d=save.done.slice(), b=save.best.slice(), perm=[0,2,3,1,4];
      for(let i=0;i<5;i++){ save.done[i]=!!d[perm[i]]; save.best[i]=b[perm[i]]||0; }
      save.v=3;
    }
    if(save.v!==4){
      const d4=save.done.slice(), b4=save.best.slice(), perm4=[0,2,3,4,1];
      for(let i=0;i<5;i++){ save.done[i]=!!d4[perm4[i]]; save.best[i]=b4[perm4[i]]||0; }
      save.v=4;
    } } }catch(e){}
try{ muted=localStorage.getItem('lh_mute')==='1'; }catch(e){}
try{ tipsOn=localStorage.getItem('lh_tips')==='1'; }catch(e){}
function persist(){ try{ localStorage.setItem('lh_save',JSON.stringify(save)); }catch(e){} }
const unlocked=i=>allUnlocked||i===0||!!save.done[i-1];

/* ================================================================
   Audio (all generated in the browser)
   ================================================================ */
let AC=null, master=null, musicT=2, padOsc=[], padGain=null;
function initAudio(){
  if(AC){ if(AC.state==='suspended') AC.resume(); return; }
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain(); master.gain.value=muted?0:0.55; master.connect(AC.destination);
    padGain=AC.createGain(); padGain.gain.value=0.0001; padGain.connect(master);
    for(const m of [1,1.5,2]){
      const o=AC.createOscillator(); o.type='sine'; o.frequency.value=130*m; 
      const g=AC.createGain(); g.gain.value=0.045; o.connect(g); g.connect(padGain); o.start(); padOsc.push({o,m});
    }
    padGain.gain.setTargetAtTime(1,AC.currentTime,2);
    setMusic(menuMusic);
  }catch(e){ AC=null; }
}
function tone(f,dur,type,vol,slide,delay,att){
  if(!AC) return; type=type||'sine'; vol=vol===undefined?0.15:vol; delay=delay||0; att=att||0.012;
  const t=AC.currentTime+delay, o=AC.createOscillator(), g=AC.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t);
  if(slide) o.frequency.exponentialRampToValueAtTime(slide,t+dur);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+att); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.05);
}
function noise(dur,vol,fc){
  if(!AC) return;
  const n=Math.floor(AC.sampleRate*dur), buf=AC.createBuffer(1,n,AC.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
  const s=AC.createBufferSource(); s.buffer=buf;
  const f=AC.createBiquadFilter(); f.type='bandpass'; f.frequency.value=fc||800;
  const g=AC.createGain(); g.gain.value=vol; s.connect(f); f.connect(g); g.connect(master); s.start();
}
const SC_MAJ=[0,2,4,7,9], SC_MIN=[0,3,5,7,10];
function note(root,scale,i){ const o=Math.floor(i/5); return root*Math.pow(2,(scale[((i%5)+5)%5]+12*o)/12); }
const menuMusic={root:261.63,scale:SC_MAJ,gap:2.2};
let curMusic=menuMusic;
function setMusic(m){
  curMusic=m;
  if(!AC) return;
  const t=AC.currentTime;
  for(const p of padOsc) p.o.frequency.setTargetAtTime(m.root/2*p.m,t,1.2);
}
let combo=0, comboT=0;
const sfx={
  jump(){ tone(360,.16,'sine',.1,620); },
  land(){ tone(140,.1,'sine',.08,80); },
  drop(){ const f=note(523.25,SC_MAJ,combo); tone(f,.4,'triangle',.13); tone(f*2,.3,'sine',.04,null,.05); },
  bounce(){ tone(200,.32,'sine',.14,720); tone(400,.25,'triangle',.05,900,.04); },
  crumble(){ noise(.22,.05,700); },
  flip(){ tone(260,.4,'sine',.1,980); tone(980,.3,'triangle',.05,330,.08); },
  die(){ tone(320,.4,'sine',.1,100); },
  stomp(){ tone(520,.12,'triangle',.09,260); },
  seed(){ for(let i=0;i<4;i++) tone(note(392,SC_MAJ,i+2),.35,'triangle',.07,null,i*.06); },
  flag(){ tone(523.25,.3,'triangle',.1); tone(659.25,.4,'triangle',.1,null,.12); },
  shard(){ for(let i=0;i<7;i++) tone(note(392,SC_MAJ,i),.8,'triangle',.1,null,i*.1); },
  ui(){ tone(660,.15,'triangle',.07); },
  sip(){ tone(note(196,SC_MIN,0),1.4,'sine',.07,null,0,.25); tone(note(196,SC_MIN,2),1.6,'sine',.04,null,.2,.3); noise(.5,.015,1300); },
  fade(){ tone(note(392,SC_MIN,3),.9,'sine',.04,null,0,.1); },
  breath(inh){ if(inh) tone(220,2.8,'sine',.032,330,0,.7); else tone(330,2.9,'sine',.032,220,0,.4); },
  pourStart(){ tone(330,.45,'sine',.045,200); noise(.45,.03,2000); },
  pour(){ noise(.22,.022,2400+Math.random()*600); },
  pop(){ tone(900,.09,'sine',.07,320); noise(.1,.03,3200); },
  popSoft(){ tone(1000,.07,'sine',.03,420); },
  unlock(){ for(let i=0;i<5;i++) tone(note(523.25,SC_MAJ,i+1),.8,'triangle',.07,null,i*.07); noise(.12,.03,2800); },
  splash(){ noise(.35,.035,1800); for(let i=0;i<4;i++) tone(note(392,SC_MAJ,i+3),.6,'triangle',.04,null,.05+i*.06); },
  blob(){ tone(480+Math.random()*60,.07,'sine',.028,640); tone(620+Math.random()*60,.08,'sine',.024,780,.08); }
};
function musicTick(dt){
  if(!AC||muted) return;
  musicT-=dt;
  if(musicT<=0){
    const m=curMusic; musicT=m.gap*(0.7+Math.random()*0.7);
    const i=Math.floor(Math.random()*8)-1;
    const f=note(m.root,m.scale,i);
    const h=(lv&&state==='play')?1-0.45*(lv.settle||0):1;
    tone(f,3.2,'sine',.06*h,null,0,.5);
    if(Math.random()<.4) tone(f*1.5,3,'sine',.03*h,null,.4,.6);
  }
}
function toggleMute(){
  muted=!muted;
  try{ localStorage.setItem('lh_mute',muted?'1':'0'); }catch(e){}
  if(master) master.gain.setTargetAtTime(muted?0:0.55,AC.currentTime,0.05);
  syncSoundBtn();
}
function syncTipsBtn(){ const b=$('btnTips'); b.textContent=tipsOn?'Tips on':'Tips off'; b.setAttribute('aria-pressed',tipsOn?'true':'false'); }
function toggleTips(){
  tipsOn=!tipsOn;
  try{ localStorage.setItem('lh_tips',tipsOn?'1':'0'); }catch(e){}
  syncTipsBtn();
}
function syncSoundBtn(){ const b=$('btnSound'); b.textContent=muted?'Sound off':'Sound on'; b.setAttribute('aria-pressed',muted?'true':'false'); }

/* ================================================================
   Level builder + level data
   ================================================================ */
function B(Wc){
  const g=[]; for(let y=0;y<ROWS;y++) g.push(new Array(Wc).fill('.'));
  const o={W:Wc,g,
    set(x,y,c){ if(x>=0&&x<Wc&&y>=0&&y<ROWS) g[y][x]=c; return o; },
    fill(x0,y0,x1,y1,c){ for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++) o.set(x,y,c); return o; },
    floor(x0,x1,h,c){ return o.fill(x0,ROWS-(h||2),x1,ROWS-1,c||'#'); },
    plat(x,y,len,c){ return o.fill(x,y,x+len-1,y,c||'#'); },
    drops(list){ for(const [x,y] of list) o.set(x,y,'o'); return o; }
  };
  return o;
}

function buildL1(){
  const b=B(112); b.floor(0,111);
  b.fill(24,15,26,16,'.');
  b.fill(14,13,17,14,'#');
  b.set(34,15,'P');
  b.plat(38,9,7);
  b.fill(58,15,72,16,'.');
  b.fill(60,14,62,16,'#'); b.set(61,14,'P');
  b.fill(65,14,69,16,'#'); b.set(67,14,'P');
  b.set(85,14,'^'); b.set(86,14,'^');
  b.fill(89,15,96,16,'.');
  b.plat(90,14,2); b.plat(93,13,2);
  b.fill(104,13,108,14,'#');
  b.set(2,14,'@'); b.set(56,14,'C'); b.set(98,14,'C'); b.set(106,12,'*'); b.set(79,14,'e');
  b.drops([[6,14],[7,13],[8,13],[9,14],[15,11],[16,11],[24,13],[25,12],[26,13],
    [40,7],[41,7],[42,7],[43,7],[63,9],[64,8],[65,9],[70,9],[71,8],[72,9],
    [85,12],[86,12],[90,12],[93,11],[100,14],[101,13],[102,14]]);
  return b;
}
function buildL2(){
  const b=B(122); b.floor(0,121);
  b.fill(13,15,25,16,'.');
  for(const x of [14,15,17,18,20,21,23,24]) b.set(x,15,'L');
  b.fill(30,13,32,14,'#');
  b.fill(37,15,62,16,'.');
  b.plat(38,14,3); b.plat(43,13,3); b.plat(48,12,3); b.plat(53,13,3); b.plat(58,14,3);
  b.set(72,14,'^'); b.set(73,14,'^');
  b.fill(77,15,94,16,'.');
  for(const x of [79,80]) b.set(x,14,'L');
  for(const x of [83,84]) b.set(x,13,'L');
  for(const x of [87,88]) b.set(x,12,'L');
  for(const x of [91,92]) b.set(x,13,'L');
  b.fill(100,14,102,14,'#'); b.fill(103,13,105,14,'#'); b.fill(106,12,108,14,'#'); b.fill(109,13,111,14,'#'); b.fill(112,14,114,14,'#');
  b.set(2,14,'@'); b.set(35,14,'T'); b.set(49,11,'C'); b.set(75,14,'T'); b.set(97,14,'T');
  b.set(107,11,'*'); b.set(68,14,'e');
  for(const [x,y] of [[33,11],[44,10],[85,10],[98,11]]) b.set(x,y,'h');
  b.drops([[6,14],[7,13],[8,14],[15,12],[18,12],[21,12],[24,12],[30,11],[31,11],
    [39,12],[44,11],[49,9],[54,11],[59,12],[72,12],[73,12],
    [79,12],[83,11],[87,10],[91,11],[101,13],[104,11],[110,11],[113,13]]);
  return b;
}
function buildL3(){
  const b=B(122); b.floor(0,121);
  for(let x=8;x<=13;x++) b.set(x,15,'~');
  b.fill(15,15,23,16,'.');
  for(let x=28;x<=33;x++) b.set(x,15,'~');
  b.fill(36,15,39,16,'.');
  b.fill(40,9,47,16,'#');
  b.fill(48,11,51,16,'#');
  b.fill(52,13,55,16,'#'); for(let x=52;x<=55;x++) b.set(x,13,'~');
  for(let x=57;x<=61;x++) b.set(x,15,'~');
  b.set(66,14,'^'); b.set(67,14,'^');
  b.fill(72,15,95,16,'.');
  for(let x=98;x<=104;x++) b.set(x,15,'~');
  b.fill(108,13,114,14,'#'); b.fill(110,12,112,12,'#');
  b.set(2,14,'@'); b.set(35,14,'C'); b.set(70,14,'C'); b.set(97,14,'C'); b.set(111,11,'*');
  b.set(63,14,'e');
  b.drops([[5,14],[18,12],[20,12],[22,12],[26,14],[30,13],
    [41,7],[43,7],[45,7],[49,9],[53,11],[58,13],[76,12],[82,9],[86,8],[90,8],[94,10],
    [100,14],[103,14],[109,11],[113,11]]);
  b.clouds=[
    {x0:480, y0:448,mx:160,my:0,  w:96,sp:1.1,ph:0},
    {x0:1168,y0:448,mx:0,  my:-192,w:96,sp:0.9,ph:0},
    {x0:2304,y0:448,mx:160,my:0,  w:96,sp:1.0,ph:0},
    {x0:2576,y0:400,mx:0,  my:-96, w:96,sp:0.8,ph:1.5},
    {x0:2704,y0:304,mx:192,my:0,  w:96,sp:0.9,ph:0.7}
  ];
  return b;
}
function buildL4(){
  const b=B(190); b.floor(0,189);
  b.fill(13,15,24,16,'.'); for(let x=13;x<=24;x++) b.set(x,15,'x');
  b.set(11,14,'1');
  b.fill(37,15,56,16,'.');
  b.set(36,14,'2');
  b.plat(38,14,3,'y'); b.plat(42,12,3,'y'); b.plat(46,10,3,'y'); b.plat(50,8,3,'y');
  b.set(43,11,'2'); b.set(47,9,'2'); b.set(51,7,'2');
  b.fill(54,8,62,16,'#');
  b.fill(63,10,66,16,'#'); b.fill(67,12,70,16,'#'); b.fill(71,14,74,16,'#');
  b.set(82,14,'^'); b.set(83,14,'^');
  b.fill(87,15,106,16,'.');
  b.plat(88,14,3,'z'); b.plat(93,13,3,'z'); b.plat(98,12,3,'z'); b.plat(103,13,3,'z');
  b.set(86,14,'3'); b.set(94,12,'3'); b.set(99,11,'3');
  // mist crossing: drifting platforms
  b.fill(126,15,142,16,'.');
  // a second vine ladder, up to a sunny ledge and back down to the garden
  b.fill(147,15,163,16,'.');
  b.plat(148,14,3,'y'); b.plat(152,12,3,'y'); b.plat(156,10,3,'y'); b.plat(160,8,3,'y');
  b.set(146,14,'2'); b.set(153,11,'2'); b.set(157,9,'2'); b.set(161,7,'2');
  b.fill(164,8,172,16,'#');
  b.fill(173,10,176,16,'#'); b.fill(177,12,180,16,'#'); b.fill(181,14,184,16,'#');
  b.fill(185,13,189,14,'#');
  b.set(2,14,'@'); b.set(28,14,'C'); b.set(58,7,'C'); b.set(76,14,'C'); b.set(108,14,'C'); b.set(145,14,'C'); b.set(166,7,'C'); b.set(183,13,'C');
  b.set(189,12,'*'); b.set(32,14,'e'); b.set(79,14,'e'); b.set(112,14,'e');

const ccache=new Map();
function C(n,a){
  a=a===undefined?1:a;
  const vq=Math.round(vivid*40), k=n+'|'+a+'|'+vq;
  let r=ccache.get(k); if(r) return r;
  const hex=pal[n]; if(!hex||hex.length<7) { return hex||'#FF00FF'; }
  const [R,G2,B2]=hex2rgb(hex), v=vq/40, gr=0.3*R+0.59*G2+0.11*B2, gm=gr*0.85+38;
  const m=c=>Math.round(gm+(c-gm)*v);
  r=a<1?`rgba(${m(R)},${m(G2)},${m(B2)},${a})`:`rgb(${m(R)},${m(G2)},${m(B2)})`;
  ccache.set(k,r); return r;
}

   Physics
   ================================================================ */
function solidAt(tx,ty){
  if(tx<0||tx>=lv.W) return true;
  if(ty<0||ty>=ROWS) return false;
  const c=lv.g[ty][tx];
  if(c==='#'||c==='P'||c==='~') return true;
  if(c==='L'){ const s=lv.leaf.get(tx+','+ty); return !s||s.s!==2; }
  if(c==='x'||c==='y'||c==='z'){
    const g=lv.groups[c]; if(g.amount<=0) return false;
    return g.amount*g.D>=lv.vd.get(tx+','+ty)-0.0001;
  }
  return false;
}
function terr(tx,ty){
  if(tx<0||tx>=lv.W||ty>=ROWS||ty<0) return true;
  const c=lv.g[ty][tx]; return c==='#'||c==='~'||c==='P';
}
function updateClouds(init){
  for(const c of lv.clouds){
    const s=0.5+0.5*Math.sin(simT*c.sp+c.ph), nx=c.x0+c.mx*s, ny=c.y0+c.my*s;
    c.dx=init?0:nx-c.x; c.dy=init?0:ny-c.y; c.x=nx; c.y=ny;
  }
}
function updateGroups(dt){
  for(const k in lv.groups){
    const g=lv.groups[k];
    if(g.pouring){ g.amount=Math.min(1,g.amount+dt/3); g.timer=10; }
    else if(g.timer>0){ g.timer-=dt; }
    else g.amount=Math.max(0,g.amount-dt/0.9);
  }
}
function updateLeaves(dt){
  for(const [key,s] of lv.leaf){
    if(s.s===1){ s.t-=dt; if(s.t<=0){ s.s=2; s.t=lv.def.still?4.5:2.6; const [tx,ty]=key.split(',').map(Number); burst((tx+.5)*T,(ty+.5)*T,6,[pal.leafA,pal.leafB],90,.7,'circle',4); } }
    else if(s.s===2){
      s.t-=dt;
      if(s.t<=0){
        const [tx,ty]=key.split(',').map(Number);
        const over=P.x<(tx+1)*T&&P.x+P.w>tx*T&&P.y<(ty+1)*T&&P.y+P.h>ty*T;
        if(!over) s.s=0;
      }
    }
  }
}
function windAt(){
  const w=lv.def.wind; if(!w) return 0;
  const ph=simT%w.period, idx=Math.floor(simT/w.period), dir=idx%2===0?1:-1, s=w.period-w.dur;
  if(ph<s) return 0;
  return dir*w.amp*Math.sin(Math.PI*(ph-s)/w.dur);
}
function windInfo(){
  const w=lv.def.wind; if(!w) return null;
  const ph=simT%w.period, idx=Math.floor(simT/w.period), dir=idx%2===0?1:-1, s=w.period-w.dur;
  if(ph>=s) return {dir,active:true,k:Math.sin(Math.PI*(ph-s)/w.dur)};
  if(ph>=s-w.warn) return {dir,active:false,k:(ph-(s-w.warn))/w.warn};
  return null;
}

function circleHit(cx,cy,r){
  const nx=clamp(cx,P.x,P.x+P.w), ny=clamp(cy,P.y,P.y+P.h), dx=cx-nx, dy=cy-ny;
  return dx*dx+dy*dy<=r*r;
}

function resolveX(){
  if(P.vx===0) return;
  const x0=Math.floor(P.x/T), x1=Math.floor((P.x+P.w-0.01)/T), y0=Math.floor(P.y/T), y1=Math.floor((P.y+P.h-0.01)/T);
  for(let ty=y0;ty<=y1;ty++) for(let tx=x0;tx<=x1;tx++){
    if(solidAt(tx,ty)){
      if(P.vx>0) P.x=tx*T-P.w; else P.x=(tx+1)*T;
      P.vx=0; return;
    }
  }
}
function resolveY(prevY,vy0){
  const gd=P.gd;
  const x0=Math.floor(P.x/T), x1=Math.floor((P.x+P.w-0.01)/T), y0=Math.floor(P.y/T), y1=Math.floor((P.y+P.h-0.01)/T);
  let hit=-1;
  if(P.vy>0){ outer1: for(let ty=y0;ty<=y1;ty++) for(let tx=x0;tx<=x1;tx++) if(solidAt(tx,ty)){ hit=ty; break outer1; } }
  else if(P.vy<0){ outer2: for(let ty=y1;ty>=y0;ty--) for(let tx=x0;tx<=x1;tx++) if(solidAt(tx,ty)){ hit=ty; break outer2; } }
  if(hit>=0){
    if(P.vy>0) P.y=hit*T-P.h; else P.y=(hit+1)*T;
    if((P.vy>0)===(gd>0)){ P.on=true; P.fall=Math.abs(P.vy); }
    P.vy=0;
  }
  if(!P.on && gd>0 && vy0>=0){
    for(const c of lv.clouds){
      if(P.x+P.w>c.x+2 && P.x<c.x+c.w-2){
        const pb=prevY+P.h;
        if(pb<=c.y+6 && P.y+P.h>=c.y){ P.y=c.y-P.h; P.fall=Math.abs(vy0); P.vy=0; P.on=true; P.riding=c; break; }
      }
    }
  }
}
function footScan(){
  P.groundChar='#';
  if(!P.on) return;
  if(P.riding){ P.groundChar='c'; return; }
  const row=P.gd>0?Math.floor((P.y+P.h+1)/T):Math.floor((P.y-1)/T);
  const x0=Math.floor(P.x/T), x1=Math.floor((P.x+P.w-0.01)/T);
  let ch='#';
  for(let tx=x0;tx<=x1;tx++){
    if(row<0||row>=ROWS) continue;
    const c=lv.g[row][tx];
    if(c==='P') ch='P'; else if(c==='~'&&ch!=='P') ch='~';
    else if(c==='L'){ const s=lv.leaf.get(tx+','+row); if(s&&s.s===0){ s.s=1; s.max=lv.def.still?1.6:0.6; s.t=s.max; if(!lv.def.still) sfx.crumble(); } }
  }
  P.groundChar=ch;
}

  P.vx=0; P.vy=0; P.on=false; P.coy=0; P.buf=0; P.jumping=false; P.dead=0; P.riding=null; P.sq=0; P.sqv=0; P.groundChar='#'; P.fall=0;

  for(const sw of lv.switches) sw.cd=0.4;

function stepPlayer(dt,inp){
  if(P.dead>0){ P.dead-=dt; if(P.dead<=0){ spawnPlayer(false); cam.x=clamp(P.x-W/2,0,lv.W*T-W); } return; }
  if(P.riding){ P.x+=P.riding.dx; P.y+=P.riding.dy; }
  P.riding=null;
  const gd=P.gd, mv=lv.pour?0:(inp.r?1:0)-(inp.l?1:0), slip=P.on&&P.groundChar==='~';
  if(mv!==0){ P.face=mv; P.vx=approach(P.vx,mv*MAXV,(P.on?(slip?650:2800):1900)*dt); }
  else P.vx=approach(P.vx,0,(P.on?(slip?260:3000):600)*dt);
  const wd=lv.def.wind;
  if(wd && !P.on && P.x>=wd.x0 && P.x<=wd.x1) P.vx+=windAt()*dt;
  P.coy=P.on?COY:Math.max(0,P.coy-dt);
  P.buf=Math.max(0,P.buf-dt);
  if(jumpPress){ P.buf=BUF; jumpPress=false; }
  if(P.buf>0&&P.coy>0){
    P.vy=-JUMP*gd; P.on=false; P.coy=0; P.buf=0; P.jumping=true; P.sq=-0.22; P.sqv=0; sfx.jump(); if(!lv.said.jump) lv.said.jumpTip=true; onNarr('jump');
    burst(P.x+P.w/2,gd>0?P.y+P.h:P.y,4,[pal.gTop],60,.35,'circle',3);
  }
  if(P.jumping&&!inp.j&&P.vy*gd<-150){ P.vy*=0.5; P.jumping=false; }
  if(P.jumping&&P.vy*gd>=0) P.jumping=false;
  P.vy+=G*gd*dt;
  if(P.vy*gd>MAXFALL) P.vy=MAXFALL*gd;
  P.x+=P.vx*dt; resolveX();
  const pyPrev=P.y, vy0=P.vy, wasOn=P.on;
  P.y+=P.vy*dt; P.on=false; P.fall=0;
  resolveY(pyPrev,vy0);
  footScan();
  if(P.on&&!wasOn&&P.fall>260){
    P.sq=clamp(P.fall/1800,0.1,0.34); P.sqv=0; sfx.land();
    burst(P.x+P.w/2,gd>0?P.y+P.h:P.y,5,[pal.gTop],70,.4,'circle',3);
  }
  if(P.on&&P.groundChar==='P'){
    P.vy=-BOUNCE*gd; P.on=false; P.jumping=false; P.coy=0; P.sq=-0.3; P.sqv=0; sfx.bounce();
    const tx=Math.floor((P.x+P.w/2)/T), ty=gd>0?Math.floor((P.y+P.h+1)/T):Math.floor((P.y-1)/T);
    lv.padAnim.set(tx+','+ty,realT);
    fxs.push({x:P.x+P.w/2,y:gd>0?P.y+P.h:P.y,vx:0,vy:0,g:0,life:.45,max:.45,r:8,col:pal.padLite||'#fff',shape:'ring'});
  }
  P.sqv+=(-P.sq*220-P.sqv*14)*dt; P.sq+=P.sqv*dt;
  if(P.y>H+60||P.y<-140) die();
}

function updateEnemies(dt){
  for(const e of lv.enemies){
    if(!e.alive) continue;
    e.x+=e.dir*42*dt;
    const fx=e.x+e.dir*(e.w/2+1), tx=Math.floor(fx/T);
    if(solidAt(tx,Math.floor((e.y-e.h/2)/T))||!solidAt(tx,Math.floor((e.y+2)/T))){ e.dir*=-1; e.x+=e.dir*2; }
  }
}

function interact(dt){
  comboT=Math.max(0,comboT-dt);
  for(const d of lv.drops){ if(!d.got&&(!d.hidden||d.rev>0.6)&&circleHit(d.x,d.y,15)) collect(d); }
  for(const c of lv.cps){
    if(!c.on&&circleHit(c.x,c.y,22)){

    }
  }
  for(const s of lv.seeds) s.pulse=Math.max(0,s.pulse-dt);
  for(const sw of lv.switches){
    sw.cd=Math.max(0,sw.cd-dt);
    const ceil=sw.y<H/2, zy0=ceil?sw.y-17:sw.y-128, zy1=ceil?sw.y+128:sw.y+17;
    if(sw.cd<=0&&P.x+P.w>sw.x-15&&P.x<sw.x+15&&P.y+P.h>zy0&&P.y<zy1){
      sw.cd=0.9; P.gd*=-1; P.on=false; P.jumping=false; P.vy*=0.2; P.coy=0; onNarr(P.gd<0?'flip':'flipBack',{delay:0.7});

    }

  for(let ty=y0;ty<=y1;ty++) for(let tx=x0;tx<=x1;tx++){
    if(ty<0||ty>=ROWS||tx<0||tx>=lv.W) continue;
    if(lv.g[ty][tx]==='^'){
      const down=terr(tx,ty-1)&&!terr(tx,ty+1);
      const rx=tx*T+7, ry=down?ty*T:ty*T+16, rw=18, rh=16;
      if(P.x+3<rx+rw&&P.x+P.w-3>rx&&P.y+3<ry+rh&&P.y+P.h-3>ry){ die(); return; }
    }
  }

    if(!e.alive) continue;
    const ex=e.x-e.w/2, ey=e.y-e.h;
    if(P.x+3<ex+e.w&&P.x+P.w-3>ex&&P.y+3<ey+e.h&&P.y+P.h-3>ey){
      if(P.gd>0&&P.vy>0&&P.y+P.h-8<e.y-e.h/2){

      } else { die(); return; }
    }

}

  const firstTime=!save.done[lv.i]; save.done[lv.i]=true; lv.newUnlock=(firstTime&&lv.i<LEVELS.length-1)?lv.i+1:-1; pendingUnlock=lv.newUnlock; save.best[lv.i]=Math.max(save.best[lv.i]||0,lv.got); persist();

  for(const h of lv.drops) if(h.hidden&&!h.shown&&!h.got&&Math.abs(h.x-P.x)<380&&Math.abs(h.y-P.y)<300) near++;
  const chai=lv.cps.some(c=>c.chai&&!c.sipped&&Math.abs(c.x-P.x)<70&&Math.abs(c.y-P.y)<70);
  lv.calmMsg=near?'Something shimmered nearby':(chai?(lv.def.breathe?'The storm eases a little':'A warm sip of chai'):'Calm. Nothing hidden close by');
  if(chai&&lv.def.breathe){
    lv.breaths=(lv.breaths||0)+1;
    if(lv.breaths===1){ onNarr('remember',{delay:0.9,y:290}); recallJoys(5); }
    else { onNarr('eased',{delay:0.9,y:190}); recallJoys(3); }
  }
  lv.calmMsgT=4.5;
  sfx.fade(); burst(P.x+P.w/2,P.y,10,[pal.leafA,pal.leafB,'#FFFFFF'],70,1.1,'star',4);

function stillUpdate(dt){
  if(!lv.def.still&&!lv.def.breathe) return;
  const inp=readInput();
  const active=inp.l||inp.r||inp.j||jumpPress||!P.on||P.dead>0;
  let atChai=false;
  for(const c of lv.cps) if(c.chai&&Math.abs(c.x-(P.x+P.w/2))<56&&Math.abs(c.y-(P.y+P.h/2))<56) atChai=true;
  lv.idle=(active||!atChai)?0:lv.idle+dt;
  if(active||!atChai) lv.calmDone=false;
  lv.calm=clamp((lv.idle-0.6)/6,0,1);
  lv.calmS=(lv.calmS||0)+((lv.calm||0)-(lv.calmS||0))*Math.min(1,dt*((lv.calm||0)>0?1.2:0.6));
  lv.calmMsgT=Math.max(0,lv.calmMsgT-dt);
  const bp=lv.idle>0.6?Math.floor((lv.idle-0.6)/3):-1;
  if(bp!==lv.bphase){ lv.bphase=bp; if(bp>=0&&lv.calm<1) sfx.breath(bp%2===0); }
  if(lv.calm>=1&&!lv.calmDone) calmReached();
  const target=lv.idle>3?1:0;
  lv.settle+=(target-lv.settle)*Math.min(1,dt*(target?1.2:5));
  const s=lv.settle;
  for(const h of lv.drops){
    if(!h.hidden||h.shown||h.got) continue;
    if(lv.calm>=1){ if(Math.abs(h.x-P.x)<380&&Math.abs(h.y-P.y)<300) h.rev=Math.min(1,h.rev+dt*0.9); }
    else h.rev=Math.max(0,h.rev-dt*0.5);
    if(h.rev>=1){ h.shown=true; burst(h.x,h.y,8,[pal.drop,'#FFFFFF'],60,1,'star',4); sfx.fade(); }
  }
  if(lv.calm>=1){
    for(const c of lv.cps){
      if(c.chai&&!c.sipped&&Math.abs(c.x-P.x)<70&&Math.abs(c.y-P.y)<70){
        c.sipped=true; c.on=true; if(lv.def.breathe) lv.worryBoost=(lv.worryBoost||0)+0.12; lv.bonus+=0.04; vividT=colorTarget(lv.paintedGot);

      }
    }

  if(s>0.5&&Math.random()<dt*5) fxs.push({x:P.x+P.w/2+(Math.random()-.5)*8,y:P.y-2,vx:(Math.random()-.5)*8,vy:-16,g:-4,life:1.7,max:1.7,r:4,col:'#FFFFFF',shape:'circle'});
}
function nearSeed(){

    const s=lv.seeds[i], dx=s.x-(P.x+P.w/2), dy=s.y-(P.y+P.h/2);
    if(Math.abs(dx)<64&&Math.abs(dy)<64&&Math.abs(dx)<bd){ bd=Math.abs(dx); best=i; }
  }

}

function flowUpdate(dt){

/* ================================================================
   Input + flow
   ================================================================ */
function startLevel(i){
  if(!unlocked(i)){ return; }
  sfx.ui();
  fadeTo(()=>{ unlockAnim=null; loadLevel(i); state='play'; document.body.classList.add('playing'); });
}
function toMap(){
  fadeTo(()=>{ state='map'; document.body.classList.remove('playing'); sel=Math.min(sel,4); setMusic(menuMusic); vivid=1; fxs=[]; unlockAnim=pendingUnlock>=0?{i:pendingUnlock,t:0,popped:false}:null; if(unlockAnim) sel=unlockAnim.i; pendingUnlock=-1; });
}
function confirm(){
  if(state==='title'){ sfx.ui(); fadeTo(()=>{ state='map'; setMusic(menuMusic); }); }
  else if(state==='map') startLevel(sel);
  else if(state==='complete'&&completeT>0.9){
    sel=Math.min(LEVELS.length-1,lv.i+(lv.i<LEVELS.length-1?1:0)); toMap();
  }
}
function epiSkip(){
  if(epiT<EPI_START){ epiT=EPI_START; return; }
  const ei=Math.floor((epiT-EPI_START)/EPI_STEP);
  epiT=EPI_START+(ei+1)*EPI_STEP+0.05;
}
function onMenuKey(code){
  if(state==='epilogue'){ if(code==='Escape'){ state='complete'; completeT=0; } else epiSkip(); return; }
  if(code==='Space'||code==='Enter'||code==='KeyZ') confirm();
  else if(state==='map'){
    if(code==='ArrowLeft'||code==='KeyA'){ sel=Math.max(0,sel-1); sfx.ui(); }
    else if(code==='ArrowRight'||code==='KeyD'){ sel=Math.min(LEVELS.length-1,sel+1); sfx.ui(); }
    else if(code==='KeyU'){ allUnlocked=true; sfx.flag(); }
  } else if(state==='complete'&&code==='Escape') toMap();
}
window.addEventListener('keydown',e=>{
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
  if(e.repeat) return;
  initAudio();
  keys[e.code]=true;
  if(e.code==='KeyM'){ toggleMute(); return; }
  if(e.code==='KeyT'){ toggleTips(); return; }
  if(state==='play'){
    if(lv&&lv.introLock&&e.code!=='Escape'&&e.code!=='KeyM') lv.skip=true;
    if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW'||e.code==='KeyZ'||e.code==='KeyX'){ jumpPress=true; if(lv&&lv.pour) lv.pour=null; }
    else if(e.code==='KeyE'||e.code==='KeyS'||e.code==='ArrowDown'||e.code==='Enter') pourPress=true;
    else if(e.code==='Escape') toMap();
    else if(e.code==='KeyR') die();
  } else onMenuKey(e.code);
});
window.addEventListener('keyup',e=>{ keys[e.code]=false; });
window.addEventListener('blur',()=>{ for(const k in keys) keys[k]=false; touch.left=touch.right=touch.jump=false; });
function readInput(){
  return {
    l:!!(keys.ArrowLeft||keys.KeyA||touch.left),
    r:!!(keys.ArrowRight||keys.KeyD||touch.right),
    j:!!(keys.Space||keys.ArrowUp||keys.KeyW||keys.KeyZ||keys.KeyX||touch.jump)
  };
}
function canvasPoint(e){ const r=cv.getBoundingClientRect(); return [(e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H]; }
cv.addEventListener('pointerdown',e=>{
  initAudio();
  if(e.pointerType==='touch'||e.pointerType==='pen') setTouchMode();
  const [x,y]=canvasPoint(e);
  if(state==='map'){
    for(let i=0;i<5;i++){ const [nx,ny]=MAP_NODES[i]; if((x-nx)**2+(y-ny)**2<(NODE_R+30)**2){ sel=i; if(unlocked(i)) startLevel(i); else sfx.ui(); return; } }
  } else if(state==='play'){ if(lv&&lv.introLock) lv.skip=true; }
  else if(state==='epilogue') epiSkip();
  else if(state==='title'||state==='complete') confirm();
});
function setTouchMode(){ if(!touchMode){ touchMode=true; document.body.classList.add('touch'); } }
window.addEventListener('touchstart',setTouchMode,{passive:true});
if(window.matchMedia&&window.matchMedia('(pointer: coarse)').matches) setTouchMode();
function bindBtn(id,key){
  const b=$(id);
  const on=e=>{ e.preventDefault(); initAudio(); touch[key]=true; b.classList.add('down'); if(key==='jump'){ jumpPress=true; if(lv&&lv.pour) lv.pour=null; } if(key==='pour') pourPress=true; if(lv&&lv.introLock) lv.skip=true; try{ b.setPointerCapture(e.pointerId); }catch(_){} };
  const off=e=>{ e.preventDefault(); touch[key]=false; b.classList.remove('down'); };
  b.addEventListener('pointerdown',on); b.addEventListener('pointerup',off); b.addEventListener('pointercancel',off); b.addEventListener('lostpointercapture',off);
  b.addEventListener('contextmenu',e=>e.preventDefault());
}
bindBtn('bL','left'); bindBtn('bR','right'); bindBtn('bJ','jump'); bindBtn('bP','pour');
$('btnSound').addEventListener('click',()=>{ initAudio(); toggleMute(); cv.focus(); });
$('btnTips').addEventListener('click',()=>{ toggleTips(); cv.focus(); });
$('btnMap').addEventListener('click',()=>{ if(state==='play') toMap(); cv.focus(); });

/* ================================================================
   Main loop
   ================================================================ */
let last=0, acc=0;
function update(dt){
  realT+=dt;
  if(fadeTarget>fadeA||fadeTarget<fadeA) fadeA=approach(fadeA,fadeTarget,dt*4.5);
  if(fadeA>=1&&fadePending){ const fn=fadePending; fadePending=null; fn(); fadeTarget=0; }
  musicTick(dt);
  vivid+=(vividT-vivid)*Math.min(1,dt*3);
  if(state==='play'){
    stillUpdate(dt);
    flowUpdate(dt);
    acc+=dt;
    let n=0; let inp=readInput();
    if(lv.introLock){ inp={l:false,r:false,j:false}; jumpPress=false; }
    while(acc>=STEP&&n<12){ simStep(STEP,inp); acc-=STEP; n++; }
    if(n>=12) acc=0;
    const tx=clamp(P.x+P.w/2-W/2+P.face*50,0,lv.W*T-W);
    cam.x+=(tx-cam.x)*(1-Math.exp(-dt*5));
    fxUpdate(dt); ambUpdate(dt);
  } else if(state==='complete'){
    completeT+=dt; fxUpdate(dt); ambUpdate(dt);
    if(lv.def.worry){ lv.worryP=(lv.worryP||0)+(1-(lv.worryP||0))*Math.min(1,dt*0.8); lv.moodS=(lv.moodS===undefined?0:lv.moodS)*(1-Math.min(1,dt*1.5)); }
    if(lv.newUnlock>=0&&completeT>0.6&&Math.random()<dt*14){ const c=LEVELS[lv.newUnlock]; fxs.push({x:cam.x+W/2+(Math.random()-.5)*460,y:H/2-112,vx:(Math.random()-.5)*24,vy:-50-Math.random()*40,g:-10,life:1.8,max:1.8,r:4,col:Math.random()<.5?c.mapColor:'#FFFFFF',shape:'star'}); }
  } else if(state==='epilogue'){
    epiT+=dt; fxUpdate(dt); ambUpdate(dt);
    lv.worryP=(lv.worryP||0)+(1-(lv.worryP||0))*Math.min(1,dt*0.8);
    lv.moodS=(lv.moodS===undefined?0:lv.moodS)*(1-Math.min(1,dt*1.5));
    const ei=Math.floor((epiT-EPI_START)/EPI_STEP);
    if(epiT>0.4&&!lv.gardenSnd){ lv.gardenSnd=true; sfx.seed(); }
    if(ei>epiLast) epiLast=ei;
    if(epiT>EPI_START+EPI.length*EPI_STEP+2.4){ state='complete'; completeT=0; }
  } else if(state==='map'||state==='title'){
    vivid=1;
    if(state==='map'){
      fxUpdate(dt);
      const ua=unlockAnim;
      if(ua){
        ua.t+=dt;
        if(!ua.popped&&ua.t>=1.1){
          ua.popped=true; const UL=LEVELS[ua.i], nd=MAP_NODES[ua.i];
          burst(nd[0],nd[1],28,[UL.mapColor,'#FFFFFF',UL.ring],250,1.3,'star',6);
          fxs.push({x:nd[0],y:nd[1],vx:0,vy:0,g:0,life:.8,max:.8,r:NODE_R,col:UL.mapColor,shape:'ring'});
          sfx.unlock();
        }
        if(ua.t>4) unlockAnim=null;
      }
    }
  }
}
function render(){
  ctx.setTransform(sc,0,0,sc,0,0);
  ctx.clearRect(0,0,W,H);
  if(state==='title') drawTitle();
  else if(state==='map') drawMap();
  else if(state==='epilogue'){ drawWorld(); drawEpilogue(); }
  else { drawWorld(); if(state==='play') drawHUD(); else { drawComplete(); drawFx(cam.x); } }
  if(fadeA>0.001){ ctx.globalAlpha=fadeA; ctx.fillStyle='#FFF4F1'; ctx.fillRect(0,0,W,H); ctx.globalAlpha=1; }
}
function frame(ts){
  requestAnimationFrame(frame);
  const dt=Math.min(0.05,Math.max(0,(ts-last)/1000)||0); last=ts;
  update(dt); render();
}

resize(); syncSoundBtn(); syncTipsBtn();
requestAnimationFrame(ts=>{ last=ts; frame(ts); });
window.__lh={loadLevel,simStep,update,render,P,startLevel:i=>{allUnlocked=true;loadLevel(i);state='play';},get lv(){return lv;},get state(){return state;},LEVELS};
})();
</script>
